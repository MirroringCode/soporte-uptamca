<div class="stats shadow lg:w-75">
    <div class="stat">
        <div class="stat-title text-warning">Soportes sin atender</div>
        <div class="stat-value text-warning">{{ no_atendidos or 0 }}</div>
    </div>
</div>

<div class="stats shadow lg:w-75">
    <div class="stat">
        <div class="stat-title text-success">Soportes atendidos</div>
        <div class="stat-value text-success">{{ atendidos or 0 }}</div>
    </div>
</div>

<div class="stats shadow lg:w-75 border-primary">
    <div class="stat">
        <div class="stat-title text-primary">Soportes en total</div>
        <div class="stat-value text-primary">{{ total or 0 }}</div>
    </div>
</div>
