<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../src/styles.css">
    <style>
        #chat-bubble { position: fixed; bottom: 2rem; right: 2rem; z-index: 1000; cursor: pointer; }
        #chat-window { position: fixed; bottom: 6.5rem; right: 2rem; width: 384px; height: 512px; z-index: 1000; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); border-radius: 1rem; display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; transform-origin: bottom right; }
        #chat-window.hidden-chat { opacity: 0; transform: scale(0.95); pointer-events: none; }
    </style>
</head>
<body hx-ext="response-targets">

    <div data-notification class="toast toast-top z-5">

    </div>


    <div class="flex justify-center items-center min-h-screen">
<div class="card w-96 bg-base-100 shadow-sm">
  <div class="card-body">

    <h2 class="card-title">Iniciar sesión</h2>
    <p class="text-sm text-gray-500 mb-4">Por favor, ingresa tus credenciales para continuar.</p>

<div class="flex flex-col gap-6">

    <form hx-post="/api/login"
    hx-target-4*="[data-notification]"
    hx-swap="innerHTML"
    method="POST" id="loginForm">
        <label class="floating-label">
            <span>Nombre de usuario</span>
            <input type="text" name="username" required placeholder="Tu usuario" class="input input-md" />
        </label>
        <label class="floating-label validator mt-[1em] relative">
            <span>Contraseña</span>
            <input id="password" type="password" name="password" required placeholder="Contraseña" class="input input-md pr-10" />
            <button type="button" id="togglePassword" class="absolute right-1/11 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700" aria-label="Mostrar contraseña">
                <!-- icono mostrar (visible por defecto) -->
                <svg class="eye w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                </svg>
                <!-- icono ocultar (inicialmente oculto) -->
                <svg class="eye-slash bi bi-eye-slash w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
                    <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
                    <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
                </svg>
            </button>
        </label>

    </form>

</div>

      <button type="submit" form="loginForm" class="btn btn-primary btn-block mt-[.75em]">Iniciar sesión</button>
  </div>
</div>
    </div>

    <div id="chat-bubble">
        <button id="chat-bubble-btn" class="btn btn-neutral btn-circle shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
        </button>
    </div>

    <div id="chat-window" class="hidden-chat bg-base-100">
        <div class="bg-base-300 p-4">
            <p class="text-xl font-semibold">Asistente de Soporte TI</p>
        </div>
        <div id="chat-log" class="flex-grow overflow-y-auto p-4 space-y-4"></div>
        <div id="chat-footer" class="bg-base-200 p-2">
            <div class="join w-full">
                <input id="user-input" type="text" placeholder="Escribe aquí..." class="input input-bordered join-item w-full" />
                <button id="send-btn" class="btn btn-neutral join-item">Enviar</button>
            </div>
        </div>
    </div>

<script type="module" src="../src/main.js"></script>
<script src="../src/chatbot.js"></script>
<script>
document.getElementById('togglePassword')?.addEventListener('click', function () {
    const pw = document.getElementById('password');
    const eye = this.querySelector('.eye');
    const eyeSlash = this.querySelector('.eye-slash');

    if (!pw) return;
    if (pw.type === 'password') {
        pw.type = 'text';
        if (eye) eye.classList.add('hidden');
        if (eyeSlash) eyeSlash.classList.remove('hidden');
        this.setAttribute('aria-label', 'Ocultar contraseña');
    } else {
        pw.type = 'password';
        if (eye) eye.classList.remove('hidden');
        if (eyeSlash) eyeSlash.classList.add('hidden');
        this.setAttribute('aria-label', 'Mostrar contraseña');
    }
});
</script>
</body>
</html>
